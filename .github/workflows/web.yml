name: Web (3 aplikasi) → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tentukan base URL (sub-path repo, kosong untuk <user>.github.io)
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "url=" >> "$GITHUB_OUTPUT"; else echo "url=/$REPO" >> "$GITHUB_OUTPUT"; fi
      - name: Export 3 aplikasi web (Pelanggan → /, Mitra → /mitra, Admin → /admin)
        env:
          EXPO_PUBLIC_BASE_URL: ${{ steps.base.outputs.url }}
          EXPO_PUBLIC_SITE_ROOT: https://${{ github.repository_owner }}.github.io${{ steps.base.outputs.url }}
          EXPO_PUBLIC_APK_URL: https://github.com/${{ github.repository }}/releases/latest
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: node scripts/build-web.mjs

      # Halaman permintaan hapus akun — WAJIB Google Play: selain jalur di dalam aplikasi, harus ada
      # tautan web publik tempat pengguna (termasuk yang sudah meng-uninstal) bisa meminta penghapusan
      # akun, dengan jalur permintaan yang menonjol dan menyebut nama aplikasi/pengembang.
      # (scripts/build-web.mjs hanya menyalin privacy.html & terms.html; halaman ini ditambahkan di sini.)
      - name: Terbitkan halaman hapus akun → /hapus-akun/
        run: |
          test -f docs/rilis/hapus-akun.html || { echo "::error::docs/rilis/hapus-akun.html tidak ada — URL hapus akun di Play Console akan 404."; exit 1; }
          mkdir -p dist/hapus-akun
          cp docs/rilis/hapus-akun.html dist/hapus-akun/index.html
          echo "• docs/rilis/hapus-akun.html → dist/hapus-akun/index.html"

      - name: Pastikan halaman hukum wajib benar-benar ada di dist/
        run: |
          for p in privacy terms hapus-akun; do
            test -s "dist/$p/index.html" || { echo "::error::dist/$p/index.html hilang — URL wajib Play Store akan 404."; exit 1; }
            echo "✔ /$p/ ($(wc -c < "dist/$p/index.html") byte)"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
