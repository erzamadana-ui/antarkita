name: Web (3 aplikasi) → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tentukan base URL (sub-path repo, kosong untuk <user>.github.io)
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "url=" >> "$GITHUB_OUTPUT"; else echo "url=/$REPO" >> "$GITHUB_OUTPUT"; fi
      - name: Export 3 aplikasi web (Pelanggan → /, Mitra → /mitra, Admin → /admin)
        env:
          EXPO_PUBLIC_BASE_URL: ${{ steps.base.outputs.url }}
          EXPO_PUBLIC_SITE_ROOT: https://${{ github.repository_owner }}.github.io${{ steps.base.outputs.url }}
          EXPO_PUBLIC_APK_URL: https://github.com/${{ github.repository }}/releases/latest
          EXPO_PUBLIC_DEMO_LOGIN: '1'   # web uji/demo: blok akun demo tampil; hapus baris ini saat produksi
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: node scripts/build-web.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
