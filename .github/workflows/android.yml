name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pelanggan, mitra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Prebuild proyek Android (Expo) — aplikasi ${{ matrix.app }}
        env:
          APP: ${{ matrix.app }}
          EXPO_PUBLIC_APP: ${{ matrix.app }}
          EXPO_PUBLIC_SITE_ROOT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          EXPO_PUBLIC_APK_URL: https://github.com/${{ github.repository }}/releases/latest
          EXPO_PUBLIC_DEMO_LOGIN: '1'   # APK uji: tampilkan blok akun demo di layar masuk (tidak ada di release-aab.yml)
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: npx expo prebuild --platform android --no-install
      - name: Build APK release (ditandatangani keystore debug — cukup untuk distribusi langsung/uji)
        env:
          APP: ${{ matrix.app }}
          EXPO_PUBLIC_APP: ${{ matrix.app }}
          EXPO_PUBLIC_SITE_ROOT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          EXPO_PUBLIC_APK_URL: https://github.com/${{ github.repository }}/releases/latest
          EXPO_PUBLIC_DEMO_LOGIN: '1'
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../antarkita-${{ matrix.app }}-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: antarkita-${{ matrix.app }}-apk
          path: antarkita-*.apk

  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: antarkita-*-apk
          merge-multiple: true
      - name: Terbitkan sebagai GitHub Release (link unduh permanen)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AntarKita APK build ${{ github.run_number }}
          body: |
            APK Android AntarKita (dua aplikasi terpisah):
            • `antarkita-pelanggan-${{ github.run_number }}.apk` — aplikasi Pelanggan
            • `antarkita-mitra-${{ github.run_number }}.apk` — aplikasi Mitra (driver, merchant, travel, mobil box)
            Panel Admin dipakai lewat web: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/admin/
            Buka APK di HP Android, izinkan "instal dari sumber tidak dikenal". Untuk Play Store gunakan `eas build -p android --profile production`.
          files: antarkita-*.apk
