name: Play Store AAB (rilis bertanda tangan)

# Membangun Android App Bundle (.aab) bertanda tangan upload-keystore untuk aplikasi Pelanggan dan/atau Mitra,
# mengunggahnya sebagai artifact + GitHub Release `aab-<run_number>`, dan (opsional) mengirim ke Play Console track internal.
#
# Rahasia (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     isi file upload keystore (.jks/.keystore) yang di-base64
#   ANDROID_KEYSTORE_PASSWORD   kata sandi keystore
#   ANDROID_KEY_ALIAS           alias key (mis. antarkita-upload)
#   ANDROID_KEY_PASSWORD        kata sandi key (bisa sama dengan kata sandi keystore)
#   PLAY_SERVICE_ACCOUNT_JSON   (opsional) JSON service account Google Play Developer API → unggah otomatis ke track internal
#   GOOGLE_SERVICES_JSON_BASE64 (opsional TAPI WAJIB agar push notification hidup di build Play)
#                               isi google-services.json dari Firebase Console, di-base64.
#                               Tanpa secret ini AAB tetap terbangun, tetapi aplikasi TIDAK bisa
#                               mendaftar token FCM → semua notifikasi push mati di rilis Play.
#
# versionCode = github.run_number + ANDROID_VERSION_CODE_OFFSET (dibaca dari app.config.ts, fallback 100) — selalu naik.
# versionName = "version" di package.json.
# Panduan lengkap: docs/rilis/CHECKLIST-GO-LIVE.md

on:
  workflow_dispatch:
    inputs:
      app:
        description: Aplikasi yang dibangun
        type: choice
        options: [both, pelanggan, mitra]
        default: both
      note:
        description: Catatan rilis / track (hanya untuk catatan di GitHub Release, mis. "internal testing batch 3")
        type: string
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Rencana build
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - id: pick
        run: |
          case "${{ github.event.inputs.app || 'both' }}" in
            pelanggan) echo 'apps=["pelanggan"]' >> "$GITHUB_OUTPUT" ;;
            mitra)     echo 'apps=["mitra"]' >> "$GITHUB_OUTPUT" ;;
            *)         echo 'apps=["pelanggan","mitra"]' >> "$GITHUB_OUTPUT" ;;
          esac

  aab:
    name: AAB ${{ matrix.app }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    env:
      # Env aplikasi HARUS ada di setiap langkah yang menyentuh Expo/Gradle: prebuild memilih apps/<app>/app + package id,
      # dan bundel JS dibuat di dalam Gradle (bundleRelease) sehingga APP/EXPO_PUBLIC_APP wajib di-set di sana juga.
      APP: ${{ matrix.app }}
      EXPO_PUBLIC_APP: ${{ matrix.app }}
      EXPO_PUBLIC_SITE_ROOT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      EXPO_PUBLIC_APK_URL: https://github.com/${{ github.repository }}/releases/latest
      # Tautan "Bagikan perjalanan" & halaman hukum: tanpa ini Safety.tsx memakai fallback dan bisa menunjuk path lama.
      EXPO_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # Server TURN untuk panggilan suara di jaringan seluler (CGNAT). Kosong = panggilan hanya berhasil di Wi-Fi.
      # Isi dari GitHub Secrets; pakai kredensial berumur pendek/berkuota (Cloudflare Realtime TURN), bukan statis.
      EXPO_PUBLIC_TURN_URL: ${{ secrets.EXPO_PUBLIC_TURN_URL }}
      EXPO_PUBLIC_TURN_USER: ${{ secrets.EXPO_PUBLIC_TURN_USER }}
      EXPO_PUBLIC_TURN_PASS: ${{ secrets.EXPO_PUBLIC_TURN_PASS }}
      EXPO_NO_TELEMETRY: 1
      CI: 1
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Pastikan rahasia keystore tersedia
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ]  && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ]  && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ]  && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secret belum di-set:$missing — lihat docs/rilis/CHECKLIST-GO-LIVE.md bagian 'Keystore'."
            exit 1
          fi
          # Uji decode + sandi/alias SEKARANG (30 detik), bukan setelah prebuild 10 menit.
          CLEAN="$(printf '%s' "$KS" | tr -d '\n\r\t ')"
          printf '%s' "$CLEAN" | base64 -d > /tmp/ks-check.jks 2>/dev/null || printf '%s' "$CLEAN" | base64 -di > /tmp/ks-check.jks \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 bukan base64 valid — buka antarkita-upload.b64 di TextEdit, Cmd+A, Cmd+C, tempel ulang."; exit 1; }
          [ -s /tmp/ks-check.jks ] || { echo "::error::ANDROID_KEYSTORE_BASE64 kosong setelah decode."; exit 1; }
          keytool -list -keystore /tmp/ks-check.jks -storepass "$KSP" -alias "$KA" >/dev/null 2>/tmp/ks-err \
            || { echo "::error::Sandi/alias keystore tidak cocok: $(tr -d '\n' </tmp/ks-err | cut -c1-160). Pastikan ANDROID_KEY_ALIAS=antarkita-upload dan sandi tanpa spasi/enter."; exit 1; }
          rm -f /tmp/ks-check.jks
          echo "Keystore OK: alias $KA terverifikasi."

      - run: npm ci

      # google-services.json TIDAK ada di repo (.gitignore). Tanpa berkas ini expo-notifications tidak
      # bisa mendaftarkan token FCM sehingga push mati total di build Play — build tetap SUKSES, jadi
      # kegagalannya senyap. Langkah ini menulis berkasnya bila secret tersedia dan memberi peringatan
      # keras (bukan error) bila tidak, supaya keputusannya sadar.
      - name: Tulis google-services.json (push notification)
        id: gsj
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          WANT: ${{ matrix.app == 'mitra' && 'id.antarkita.mitra' || 'id.antarkita.app' }}
        run: |
          if [ -z "$GSJ" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON_BASE64 kosong — AAB dibangun TANPA Firebase. Notifikasi push tidak akan berfungsi di rilis Play Store."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Toleran terhadap cara tempel: base64 murni, base64 dengan enter/spasi, atau JSON mentah.
          CLEAN="$(printf '%s' "$GSJ" | tr -d '\n\r\t ')"
          case "$CLEAN" in
            \{*) printf '%s' "$GSJ" > google-services.json ;;
            *)   printf '%s' "$CLEAN" | base64 -d > google-services.json 2>/dev/null \
                   || printf '%s' "$CLEAN" | base64 -di > google-services.json \
                   || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 bukan base64 valid dan bukan JSON — buka google-services.b64 di TextEdit, Cmd+A, Cmd+C, tempel ulang."; exit 1; } ;;
          esac
          node -e "
            const j = require('./google-services.json');
            const ids = (j.client || []).map((c) => c.client_info.android_client_info.package_name);
            console.log('package_name di google-services.json:', ids.join(', '));
            if (!ids.includes(process.env.WANT)) {
              console.log('::error::google-services.json tidak memuat ' + process.env.WANT + ' — tambahkan aplikasi Android itu di Firebase Console lalu unduh ulang berkasnya.');
              process.exit(1);
            }
          "
          echo "path=./google-services.json" >> "$GITHUB_OUTPUT"

      - name: Hitung versionCode & versionName
        id: ver
        run: |
          OFFSET=$(grep -oE 'ANDROID_VERSION_CODE_OFFSET[[:space:]]*=[[:space:]]*[0-9]+' app.config.ts | grep -oE '[0-9]+$' | head -n1)
          OFFSET=${OFFSET:-100}
          CODE=$(( ${{ github.run_number }} + OFFSET ))
          NAME=$(node -p "require('./package.json').version")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE (run ${{ github.run_number }} + offset $OFFSET), versionName=$NAME"

      - name: Prebuild proyek Android (Expo) — ${{ matrix.app }}
        env:
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          # Dibaca app.config.ts → android.googleServicesFile. Kosong = tanpa Firebase (push mati).
          GOOGLE_SERVICES_JSON: ${{ steps.gsj.outputs.path }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verifikasi package id & versi hasil prebuild
        run: |
          EXPECTED=$([ "${{ matrix.app }}" = "mitra" ] && echo id.antarkita.mitra || echo id.antarkita.app)
          # Expo prebuild menulis kutip TUNGGAL dan (SDK 57) bentuk `applicationId = '...'`; pola harus menerima
          # keduanya — pola lama (kutip ganda saja) membuat APPID kosong dan build gagal semu (run #2).
          GRADLE=android/app/build.gradle
          [ -f "$GRADLE" ] || { echo "::error::$GRADLE tidak ada — prebuild gagal diam-diam. Lihat log langkah Prebuild."; exit 1; }
          APPID=$(grep -oE "applicationId[[:space:]]*=?[[:space:]]*['\"][^'\"]+['\"]" "$GRADLE" | head -n1 | sed -E "s/.*['\"]([^'\"]+)['\"]/\1/")
          echo "applicationId=$APPID (diharapkan $EXPECTED)"
          [ "$APPID" = "$EXPECTED" ] || { echo "::error::applicationId '$APPID' ≠ $EXPECTED — periksa META di app.config.ts"; exit 1; }
          grep -qE 'versionCode[[:space:]]*=?[[:space:]]*${{ steps.ver.outputs.code }}\b' "$GRADLE" || { echo "::error::versionCode tidak sesuai (diharapkan ${{ steps.ver.outputs.code }}): $(grep -E 'versionCode' "$GRADLE" | head -n1)"; exit 1; }
          grep -qE "versionName[[:space:]]*=?[[:space:]]*['\"]${{ steps.ver.outputs.name }}['\"]" "$GRADLE" || { echo "::error::versionName tidak sesuai (diharapkan ${{ steps.ver.outputs.name }}): $(grep -E 'versionName' "$GRADLE" | head -n1)"; exit 1; }

          # --- Target API level (kebijakan Google Play) ---------------------------------
          # Sejak 31 Agustus 2026 aplikasi BARU dan pembaruan wajib targetSdk >= 36 (Android 16).
          # Nilainya datang dari rootProject.ext.targetSdkVersion (katalog versi react-native),
          # jadi bisa turun diam-diam saat menaikkan/menurunkan versi Expo/RN. Dikunci di sini.
          TARGET=$(grep -oE 'targetSdk *= *"[0-9]+"' node_modules/react-native/gradle/libs.versions.toml | grep -oE '[0-9]+' || true)
          echo "targetSdkVersion=$TARGET (minimum Play untuk aplikasi baru: 36)"
          [ -n "$TARGET" ] && [ "$TARGET" -ge 36 ] || { echo "::error::targetSdkVersion=$TARGET < 36 — Play menolak unggahan sejak 31 Agustus 2026."; exit 1; }

          # --- Izin (Data safety & Permissions declaration) -----------------------------
          MF=android/app/src/main/AndroidManifest.xml
          echo "Izin yang BENAR-BENAR diminta:"
          grep -oE '<uses-permission android:name="[^"]+"[^>]*>' "$MF" | grep -v 'tools:node="remove"' \
            | grep -oE 'android:name="[^"]+"' | sed 's/.*="//;s/"//' | sort -u | sed 's/^/  • /' || true
          echo "Izin yang DIBLOKIR (tools:node=\"remove\" → hilang setelah manifest merger):"
          grep -oE '<uses-permission android:name="[^"]+"[^>]*tools:node="remove"' "$MF" \
            | grep -oE 'android:name="[^"]+"' | sed 's/.*="//;s/"//' | sort -u | sed 's/^/  • /' || true

          # Izin berisiko tinggi tidak boleh muncul TANPA penanda remove — bila muncul, Play meminta
          # deklarasi + video demo, dan jawaban "No" pada form App content jadi salah (alasan penolakan).
          for P in ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION SYSTEM_ALERT_WINDOW READ_MEDIA_IMAGES READ_MEDIA_VIDEO; do
            if grep -E "android.permission.$P\"" "$MF" | grep -qv 'tools:node="remove"'; then
              echo "::error::Izin $P aktif di manifest tetapi form App content menjawab \"No\" — perbarui app.config.ts atau jawaban Play Console."; exit 1
            fi
          done
          # Advertising ID: jawaban Data safety adalah "tidak memakai" — pastikan tidak ada pustaka yang menyisipkannya.
          if grep -E 'com.google.android.gms.permission.AD_ID' "$MF" | grep -qv 'tools:node="remove"'; then
            echo "::error::AD_ID aktif di manifest — bertentangan dengan jawaban Advertising ID \"No\" di Play Console."; exit 1
          fi

      - name: Pasang upload keystore & konfigurasi signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANTARKITA_UPLOAD_STORE_FILE: release.keystore
          ANTARKITA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANTARKITA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANTARKITA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          CLEAN="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r\t ')"
          printf '%s' "$CLEAN" | base64 -d > android/app/release.keystore 2>/dev/null || printf '%s' "$CLEAN" | base64 -di > android/app/release.keystore
          [ -s android/app/release.keystore ] || { echo "::error::Decode keystore gagal (ANDROID_KEYSTORE_BASE64 kosong/rusak)"; exit 1; }
          keytool -list -keystore android/app/release.keystore -storepass "$ANTARKITA_UPLOAD_STORE_PASSWORD" -alias "$ANTARKITA_UPLOAD_KEY_ALIAS" >/dev/null \
            || { echo "::error::Kata sandi/alias keystore tidak cocok"; exit 1; }
          node scripts/android-signing.mjs --dir android

      - name: Gradle bundleRelease — ${{ matrix.app }}
        env:
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          OUT=app/build/outputs/bundle/release/app-release.aab
          [ -f "$OUT" ] || { echo "::error::AAB tidak ditemukan"; exit 1; }
          cp "$OUT" "../antarkita-${{ matrix.app }}-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.aab"

      - name: Verifikasi tanda tangan & ukuran AAB
        run: |
          AAB=$(ls antarkita-${{ matrix.app }}-*.aab)
          keytool -printcert -jarfile "$AAB" | tee cert.txt
          if grep -qi 'CN=Android Debug' cert.txt; then echo "::error::AAB masih ditandatangani debug key!"; exit 1; fi
          rm -f cert.txt
          # Batas Google Play: ukuran unduhan TERKOMPRESI modul dasar maks. 500 MB (dihitung Play Console
          # saat unggah). Ukuran berkas .aab bukan angka yang dinilai Play, tetapi kalau .aab saja sudah
          # ratusan MB, ukuran unduhan hampir pasti bermasalah — jadi diberi peringatan dini di sini.
          BYTES=$(stat -c%s "$AAB")
          echo "| ${{ matrix.app }} | \`$AAB\` | $(numfmt --to=iec --suffix=B "$BYTES") |" >> "$GITHUB_STEP_SUMMARY"
          echo "Ukuran $AAB = $(numfmt --to=iec --suffix=B "$BYTES")"
          [ "$BYTES" -lt 209715200 ] || echo "::warning::AAB > 200 MB — periksa Play Console → App bundle explorer untuk ukuran unduhan terkompresi (batas modul dasar 500 MB)."

      - name: Bersihkan rahasia dari runner
        if: always()
        run: |
          rm -f android/app/release.keystore google-services.json android/app/google-services.json
          sed -i '/^ANTARKITA_UPLOAD_/d' android/gradle.properties 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: antarkita-${{ matrix.app }}-aab
          path: antarkita-${{ matrix.app }}-*.aab
          if-no-files-found: error
          retention-days: 30

      # Unggah otomatis ke Play Console (track internal) — hanya jika secret PLAY_SERVICE_ACCOUNT_JSON ada.
      # Secret tidak bisa dipakai langsung di `if`, jadi dijembatani lewat env.
      - name: Cek ketersediaan service account Play
        id: play
        env:
          HAS_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: echo "enabled=$HAS_SA" >> "$GITHUB_OUTPUT"

      - name: Unggah ke Play Console (internal testing)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.app == 'mitra' && 'id.antarkita.mitra' || 'id.antarkita.app' }}
          releaseFiles: antarkita-${{ matrix.app }}-*.aab
          track: internal
          status: completed
          releaseName: v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          changesNotSentForReview: false

  release:
    name: GitHub Release aab-${{ github.run_number }}
    needs: aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: antarkita-*-aab
          merge-multiple: true
      - name: Daftar berkas
        run: ls -la *.aab && sha256sum *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-${{ github.run_number }}
          name: AntarKita AAB build ${{ github.run_number }}
          prerelease: true
          body: |
            Android App Bundle bertanda tangan upload-keystore untuk Google Play.
            ${{ github.event.inputs.note && format('Catatan: {0}', github.event.inputs.note) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('Dipicu tag `{0}`.', github.ref_name) || 'Dipicu manual (workflow_dispatch).' }}

            • `antarkita-pelanggan-*.aab` — aplikasi Pelanggan (`id.antarkita.app`)
            • `antarkita-mitra-*.aab` — aplikasi Mitra (`id.antarkita.mitra`)

            Unggah ke Play Console → Testing → Internal testing → Create new release (atau otomatis bila secret PLAY_SERVICE_ACCOUNT_JSON di-set).
            AAB tidak bisa diinstal langsung ke HP; untuk uji langsung pakai APK dari workflow "Android APK".
          files: |
            *.aab
            SHA256SUMS.txt
